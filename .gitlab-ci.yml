image: node:22-alpine

variables:
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
  GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task

stages:
  - test
  - build
  - sonarqube-check
  - sonarqube-vulnerability-report
  - dockerize
  - deploy

# ── 1. Frontend Checks (Lint, TypeScript, and Tests) ──────────────────────────
frontend_checks:
  stage: test
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  before_script:
    - corepack enable pnpm
    - pnpm config set store-dir .pnpm-store
  script:
    - pnpm install --frozen-lockfile
    - pnpm run lint
    - pnpm run typecheck
    - pnpm run test:coverage
  artifacts:
    paths:
      - coverage/
    expire_in: 1 day

# ── 1.5. Frontend Build ────────────────────────────────────────────────────────
frontend_build:
  stage: build
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  before_script:
    - corepack enable pnpm
    - pnpm config set store-dir .pnpm-store
  script:
    - pnpm install --frozen-lockfile
    - pnpm run build
  artifacts:
    paths:
      - .nuxt/
      - .output/
    expire_in: 1 day

# ── 2. SonarQube ───────────────────────────────────────────────────────────────
sonarqube-check:
  stage: sonarqube-check
  image:
    name: sonarsource/sonar-scanner-cli:11
    entrypoint: [""]
  script:
    - sonar-scanner -Dsonar.host.url="${SONAR_HOST_URL}"
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_BRANCH == 'develop'

sonarqube-vulnerability-report:
  stage: sonarqube-vulnerability-report
  image:
    name: sonarsource/sonar-scanner-cli:11
    entrypoint: [""]
  script:
    - 'curl -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/issues/gitlab_sast_export?projectKey=SP1_seliveli&branch=${CI_COMMIT_BRANCH}&pullRequest=${CI_MERGE_REQUEST_IID}" -o gl-sast-sonar-report.json'
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_BRANCH == 'develop'
  artifacts:
    expire_in: 1 day
    reports:
      sast: gl-sast-sonar-report.json

# ── 3. Frontend dockerize ────────────────
dockerize_frontend:
  stage: dockerize
  image:
    name: gcr.io/kaniko-project/executor:v1.22.0-debug
    entrypoint: [""]
  needs:
    - frontend_build
  script:
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE}/frontend:${CI_COMMIT_SHA}"
      --destination "${CI_REGISTRY_IMAGE}/frontend:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == 'main'

# ── 4. Frontend deploy na AWS ───────────────
deploy_frontend_aws:
  stage: deploy
  image: alpine:3.21
  needs:
    - dockerize_frontend
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - chmod 400 "$SSH_PRIVATE_KEY"
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
  script:
    - echo "$CI_REGISTRY_PASSWORD" | ssh -i "$SSH_PRIVATE_KEY" $SSH_USER@$SERVER_IP "docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY"
    - >
      ssh -i "$SSH_PRIVATE_KEY" $SSH_USER@$SERVER_IP "
      docker pull ${CI_REGISTRY_IMAGE}/frontend:latest &&
      docker stop frontend-app || true &&
      docker rm frontend-app || true &&
      docker run -d --name frontend-app -p 3000:3000 --restart unless-stopped --env-file /home/ubuntu/.env.frontend ${CI_REGISTRY_IMAGE}/frontend:latest
      "
  rules:
    - if: $CI_COMMIT_BRANCH == 'main'
